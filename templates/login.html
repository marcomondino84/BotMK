<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotMK · Acceso Seguro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#070b14] text-slate-200 flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl p-7 space-y-6 backdrop-blur">
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-2xl">
                ⚡
            </div>
            <h1 class="text-xl font-bold text-white tracking-wide font-mono">BOTMK QUANT TERMINAL</h1>
            <p class="text-xs text-slate-400">Iniciá sesión para acceder al panel de operaciones</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-[11px] font-mono uppercase text-slate-400 mb-1.5">Correo electrónico</label>
                <input type="email" id="email" required autocomplete="email"
                       placeholder="tu@correo.com"
                       class="w-full bg-slate-950/80 border border-slate-700 focus:border-emerald-500 rounded-lg px-3.5 py-2.5 text-sm text-white outline-none transition-colors">
            </div>

            <div>
                <label class="block text-[11px] font-mono uppercase text-slate-400 mb-1.5">Contraseña</label>
                <input type="password" id="password" required autocomplete="current-password"
                       placeholder="••••••••••••"
                       class="w-full bg-slate-950/80 border border-slate-700 focus:border-emerald-500 rounded-lg px-3.5 py-2.5 text-sm text-white outline-none transition-colors">
            </div>

            <div id="errorBox" class="hidden p-2.5 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs font-mono text-center"></div>

            <button type="submit" id="submitBtn"
                    class="w-full py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-mono font-bold text-sm transition-all shadow-lg disabled:opacity-50">
                Ingresar al Panel
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('errorBox');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Verificando...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    errorBox.textContent = data.detail || 'Credenciales inválidas.';
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                errorBox.textContent = 'Error de conexión con el servidor.';
                errorBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Ingresar al Panel';
            }
        });
    </script>
</body>
</html>
